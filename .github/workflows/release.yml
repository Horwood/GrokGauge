name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: ./scripts/test.sh

      - name: Build GrokGauge.app (universal, ad-hoc signed)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REQUIRE_UNIVERSAL: "1"
        run: ./scripts/build-app.sh

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GrokGauge-${{ steps.version.outputs.version }}.zip
            dist/GrokGauge-${{ steps.version.outputs.version }}.zip.sha256
          generate_release_notes: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrokGauge-${{ steps.version.outputs.version }}
          path: dist/*.zip*
