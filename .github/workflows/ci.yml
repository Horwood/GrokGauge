name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Test
        run: ./scripts/test.sh
      - name: Build app (arm64 + x86_64)
        run: REQUIRE_UNIVERSAL=1 ./scripts/build-app.sh
